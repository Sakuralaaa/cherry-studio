name: Lite Windows Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LITE_PLAN.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lite-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-win-x64:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck (main + renderer)
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          pnpm typecheck:node
          pnpm typecheck:web

      - name: Build app
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          pnpm exec dotenv -v CHERRY_EDITION=global -- electron-vite build
          pnpm run build:utility-process

      - name: Package NSIS installer (x64)
        env:
          ELECTRON_BUILDER_7Z_FILTER: BCJ
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm exec electron-builder --win nsis --x64 --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cherry-studio-lite-win-x64
          path: |
            dist/*-setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="lite-v${VERSION}-build.${{ github.run_number }}"
          gh release create "$TAG" dist/*-setup.exe \
            --target "${{ github.sha }}" \
            --title "Cherry Studio Lite ${VERSION} (build ${{ github.run_number }})" \
            --notes "Windows x64 安装包，由 GitHub Actions 自动构建。精简版基于 CherryHQ/cherry-studio（AGPL-3.0），仅保留对话与模型管理。" \
            --latest
